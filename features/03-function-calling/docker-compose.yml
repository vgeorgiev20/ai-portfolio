services:
  api:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /app
    volumes:
      - ./api:/app
    command: >
      sh -c "dotnet restore && dotnet run --urls http://0.0.0.0:5001"
    ports:
      - "5001:5001"

  frontend:
    image: node:22
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - api
